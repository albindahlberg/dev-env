# Set prefix to Ctrl-a (easier than default Ctrl-b)
unbind C-b
set -g prefix M-a
bind M-a send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# New panes and windows start at the same dir as the current
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Enable true color support for Neovim
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Easier pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim bindings
bind v copy-mode
# Enable vi mode
set-window-option -g mode-keys vi
# Vi-style copy mode bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Copy to system clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Reload config easily
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
# ============================================
# STATUS BAR - Clean & Minimal
# ============================================

# Status bar colors
set -g status-style bg=black,fg=white

# Left side: just session name
set -g status-left "#[fg=#9ccfd8]#S "

# Right side: just time
set -g status-right "#[fg=white]%H:%M"

# Window status
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg=black,bg=#9ccfd8

# Pane borders
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=#9ccfd8

# Message colors
set -g message-style bg=black,fg=#9ccfd8

# ============================================
# PLUGINS
# ============================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Smart pane switching with Alt-h/j/k/l
# This checks if we're in vim and uses vim-tmux-navigator, otherwise switches panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n M-h if-shell "$is_vim" "send-keys M-h"  "select-pane -L"
bind -n M-j if-shell "$is_vim" "send-keys M-j"  "select-pane -D"
bind -n M-k if-shell "$is_vim" "send-keys M-k"  "select-pane -U"
bind -n M-l if-shell "$is_vim" "send-keys M-l"  "select-pane -R"

# Plugin settings
set -g @resurrect-strategy-nvim 'session'  # Restore nvim sessions
set -g @continuum-restore 'on'             # Auto-restore last saved environment

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
