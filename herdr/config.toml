onboarding = false

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "alt+a"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

goto = "prefix+g"
open_worktree = "prefix+shift+a"

previous_agent = "prefix+shift+k"
next_agent = "prefix+shift+j"

split_vertical = "prefix+|"
copy_mode = "prefix+v"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = '$(dirname "$(readlink ~/.config/herdr/config.toml)")/agent-nav.sh'
description = "navigate agents"
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = '$(dirname "$(readlink ~/.config/herdr/config.toml)")/worktree-nav.sh'
description = "worktrees (enter open, d remove)"
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = '$(dirname "$(readlink ~/.config/herdr/config.toml)")/worktree-new.sh'
description = "new worktree in a tab"
width = "50%"
height = "30%"

[[keys.command]]
key = "prefix+alt+c"
type = "popup"
command = 'PATH="$HOME/.cargo/bin:$PATH" just check'
description = "just check"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+s"
type = "popup"
command = 'PATH="$HOME/.cargo/bin:$PATH" just smoke'
description = "just smoke"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+r"
type = "popup"
command = 'PATH="$HOME/.cargo/bin:$PATH" just run'
description = "just run"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+d"
type = "popup"
command = 'PATH="$HOME/.cargo/bin:$PATH" just debug'
description = "just debug"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = 'PATH="$HOME/.cargo/bin:$PATH" just test'
description = "just test"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+j"
type = "popup"
command = "PATH=\"$HOME/.cargo/bin:$PATH\" just --chooser \"fzf -1 --bind=j:down,k:up,q:abort,one:accept\" --choose || read -p 'press enter to close' _"
description = "pick just recipe"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+l"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "95%"
height = "95%"

[ui]
mouse_capture = false
host_cursor = "native"

show_agent_labels_on_pane_borders = true

[theme]
name = "vesper"
auto_switch = false

[ui.toast]
delivery = "herdr"
